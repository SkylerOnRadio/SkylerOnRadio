name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs every day at midnight
  workflow_dispatch:              # Allows manual execution
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

          base: ""
          
          # --- LANGUAGES PLUGIN CONFIGURATION ---
          plugin_languages: yes
          plugin_languages_sections: most-used     # Options: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines # Displays exact line counts
          plugin_languages_indepth: yes            # Clones and calculates data aggressively
          plugin_languages_limit: 8                # Max number of languages to display
          plugin_languages_threshold: 2%           # Hides languages below 2% pool size
